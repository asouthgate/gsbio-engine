name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Engine dependencies
        run: npm ci

      - name: Build Engine Core
        run: npm run build

      - name: Install Example dependencies
        run: npm ci --prefix examples/demo-web

      - name: Build Example App
        run: npm run build --prefix examples/demo-web

      - name: Upload demo-web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: examples/demo-web/dist